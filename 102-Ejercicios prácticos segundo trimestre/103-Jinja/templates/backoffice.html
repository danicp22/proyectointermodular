<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Backoffice</title>
    <style>
        html,body{background: #87CEEB;width: 100%;height: 100%;padding: 0px;margin: 0px;}
        main{display: flex;height: 100%;}
        header{padding: 20px;}
        nav{flex:1;padding: 20px;display: flex;flex-direction: column;gap: 20px;}
        section{flex:5;background: white;padding: 20px;}
        nav a{background: #ffffff;padding: 20px;}
    </style>
</head>
<body>
    <header><h3>Aplicacion empresarial de Dani</h3></header>
    <main>
        <nav>
            {% for tabla in mis_tablas:%}
                <a>{{tabla}}</a>
            {% endfor %}
        </nav>
        <section>
            <style>
                table{width: 100%;border-collapse: collapse;border:2px solid #87CEEB;}
                table th,table td{padding: 10px;text-align: center;}
                table thead{background: #87CEEB;}
            </style>
            <table>
                <thead>
                    <tr>
                        {% for columna in mis_columnas%}
                            <th>{{columna}}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for fila in mi_contenido_tabla:%}
                    <tr>
                        {% for dato in fila:%}
                            <td>{{dato}}</td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
